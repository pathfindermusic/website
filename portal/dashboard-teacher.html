<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Schedule — Pathfinder Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
  <style>
    .day-block { margin-bottom: 1.5rem; }
    .day-heading {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--mid-grey);
      padding: 0 0 0.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .day-heading.today { color: var(--orange); }
    .day-heading.today::after {
      content: 'Today';
      font-size: 0.65rem;
      background: rgba(232,73,30,0.12);
      color: var(--orange);
      border: 1px solid rgba(232,73,30,0.25);
      border-radius: 20px;
      padding: 0.1rem 0.5rem;
    }
    .lesson-row-teacher {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 1rem;
      align-items: start;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }
    .lesson-row-teacher:last-child { border-bottom: none; }
    .lesson-row-teacher:hover { background: var(--off-white); }
    .lesson-row-teacher.cancelled { opacity: 0.4; }
    .lesson-actions { display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-end; }
    .att-select {
      font-size: 0.78rem;
      font-family: 'Inter', sans-serif;
      padding: 0.35rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--white);
      color: var(--charcoal);
      cursor: pointer;
      -webkit-appearance: none;
    }
    .att-select:focus { outline: none; border-color: var(--orange); }
  </style>
</head>
<body>

<div class="portal-shell">

  <!-- TOP NAV -->
  <nav class="topnav">
    <a href="#" class="topnav-logo">
      <img src="../Logo_-_long.png" alt="Pathfinder Music Lessons">
    </a>
    <div class="topnav-right">
      <button class="btn btn-ghost btn-sm" id="menuToggle" style="display:none;" onclick="toggleSidebar()">☰</button>
      <div class="topnav-user">
        <div class="topnav-avatar" id="navAvatar">–</div>
        <div>
          <div style="font-size:0.82rem;font-weight:500;color:var(--white);" id="navName">Loading…</div>
          <span class="topnav-role-badge" id="navRole">Teacher</span>
        </div>
      </div>
      <button class="btn-logout" onclick="signOut()">Sign out</button>
    </div>
  </nav>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">Main</div>
    <a class="nav-item active" href="dashboard-teacher.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      My Schedule
    </a>
    <a class="nav-item" href="my-students.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      My Students
    </a>
    <a class="nav-item" href="my-notes.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Lesson Notes
    </a>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <!-- Stats row -->
    <div class="stats-row" id="statsRow">
      <div class="stat-card">
        <div class="stat-card-top">
          <span class="stat-label">Today's lessons</span>
          <div class="stat-icon">📅</div>
        </div>
        <div class="stat-value" id="statToday">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-top">
          <span class="stat-label">This week</span>
          <div class="stat-icon">📊</div>
        </div>
        <div class="stat-value" id="statWeek">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-top">
          <span class="stat-label">My students</span>
          <div class="stat-icon">👥</div>
        </div>
        <div class="stat-value" id="statStudents">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-top">
          <span class="stat-label">Unmarked</span>
          <div class="stat-icon">⚠️</div>
        </div>
        <div class="stat-value" id="statUnmarked">–</div>
        <div class="stat-sub">past lessons</div>
      </div>
    </div>

    <!-- Page header -->
    <div class="page-header">
      <div>
        <div class="page-title">My Schedule</div>
        <div class="page-sub" id="weekRangeLabel">Loading…</div>
      </div>
      <div class="week-nav">
        <button class="week-nav-btn" onclick="prevWeek()">‹</button>
        <button class="btn btn-ghost btn-sm" onclick="goToday()">Today</button>
        <button class="week-nav-btn" onclick="nextWeek()">›</button>
      </div>
    </div>

    <!-- Schedule by day -->
    <div id="scheduleWrap">
      <div class="loading"><div class="spinner"></div> Loading schedule…</div>
    </div>

  </main>
</div>

<!-- Note modal -->
<div class="modal-overlay hidden" id="noteModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="noteModalTitle">Lesson Note</span>
      <button class="modal-close" onclick="closeNoteModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Practice notes for student</label>
        <textarea class="form-textarea" id="noteText" placeholder="What did you work on? What should the student practice before next lesson?"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Google Drive link (optional)</label>
        <input class="form-input" type="url" id="driveLink" placeholder="https://drive.google.com/...">
        <div class="form-hint">Paste a link to any shared recordings, sheet music or materials.</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeNoteModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNote()">Save Note</button>
    </div>
  </div>
</div>

<div id="toastWrap" class="toast-wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>

let currentProfile = null;
let teacherRecord  = null;
let weekStart      = getWeekStart(new Date());
let activeOccurrenceId = null;

// ---- Init ----
(async () => {
  currentProfile = await requireAuth(['teacher']);
  if (!currentProfile) return;

  renderTopNavUser(currentProfile);
  if (window.innerWidth < 900) document.getElementById('menuToggle').style.display = '';

  // Get teacher record
  const { data: t } = await db.from('teachers').select('*').eq('user_id', currentProfile.id).single();
  teacherRecord = t;

  await Promise.all([loadStats(), loadSchedule()]);
})();

// ---- Stats ----
async function loadStats() {
  if (!teacherRecord) return;
  const today  = toISODate(new Date());
  const wEnd   = toISODate(new Date(weekStart.getTime() + 6 * 86400000));
  const wStart = toISODate(weekStart);

  const [todayRes, weekRes, studentsRes, unmarkedRes] = await Promise.all([
    db.from('schedule_view').select('occurrence_id', {count:'exact'}).eq('teacher_id', teacherRecord.id).eq('date', today).neq('occurrence_status','cancelled'),
    db.from('schedule_view').select('occurrence_id', {count:'exact'}).eq('teacher_id', teacherRecord.id).gte('date', wStart).lte('date', wEnd).neq('occurrence_status','cancelled'),
    db.from('student_teachers').select('student_id', {count:'exact'}).eq('teacher_id', teacherRecord.id),
    db.from('schedule_view').select('occurrence_id', {count:'exact'}).eq('teacher_id', teacherRecord.id).lt('date', today).eq('occurrence_status','scheduled'),
  ]);

  document.getElementById('statToday').textContent    = todayRes.count  ?? '–';
  document.getElementById('statWeek').textContent     = weekRes.count   ?? '–';
  document.getElementById('statStudents').textContent = studentsRes.count ?? '–';
  document.getElementById('statUnmarked').textContent = unmarkedRes.count ?? '–';
}

// ---- Week navigation ----
function prevWeek() { weekStart = new Date(weekStart.getTime() - 7 * 86400000); loadSchedule(); }
function nextWeek() { weekStart = new Date(weekStart.getTime() + 7 * 86400000); loadSchedule(); }
function goToday()  { weekStart = getWeekStart(new Date()); loadSchedule(); }

// ---- Load schedule ----
async function loadSchedule() {
  if (!teacherRecord) return;
  const wrap   = document.getElementById('scheduleWrap');
  const days   = getWeekDays(weekStart);
  const wStart = toISODate(days[0]);
  const wEnd   = toISODate(days[days.length - 1]);

  document.getElementById('weekRangeLabel').textContent =
    `${formatShortDate(days[0])} – ${formatShortDate(days[days.length - 1])}`;

  wrap.innerHTML = `<div class="loading"><div class="spinner"></div> Loading…</div>`;

  const { data, error } = await db
    .from('schedule_view')
    .select('*')
    .eq('teacher_id', teacherRecord.id)
    .gte('date', wStart)
    .lte('date', wEnd)
    .order('date')
    .order('start_time');

  if (error) {
    wrap.innerHTML = `<div class="empty-state"><p style="color:#dc2626;">${error.message}</p></div>`;
    return;
  }

  if (!data || data.length === 0) {
    wrap.innerHTML = `<div class="card"><div class="empty-state">
      <div class="empty-state-icon">🎵</div>
      <h3>No lessons this week</h3>
      <p>Enjoy the break! Check another week using the navigation above.</p>
    </div></div>`;
    return;
  }

  // Group by date
  const byDate = {};
  days.forEach(d => byDate[toISODate(d)] = []);
  data.forEach(r => { const k = toISODate(new Date(r.date)); if (byDate[k]) byDate[k].push(r); });

  const today = toISODate(new Date());
  let html = '';

  days.forEach(d => {
    const key     = toISODate(d);
    const lessons = byDate[key];
    if (!lessons || lessons.length === 0) return;

    const isToday = key === today;
    html += `<div class="day-block card">
      <div class="card-header">
        <div class="day-heading ${isToday ? 'today' : ''}">${formatShortDate(d).toUpperCase()}</div>
        <div class="text-sm text-muted">${lessons.length} lesson${lessons.length !== 1 ? 's' : ''}</div>
      </div>`;

    lessons.forEach(l => {
      const isCancelled = l.occurrence_status === 'cancelled';
      const isPast      = key < today;
      const attStatus   = l.attendance_status ?? '';

      html += `<div class="lesson-row-teacher ${isCancelled ? 'cancelled' : ''}">
        <div>
          <div class="time-cell">${formatTime(l.start_time)}</div>
          <div class="duration-label">${formatDuration(l.duration_mins)}</div>
        </div>
        <div>
          <div class="lesson-name">${l.student_name}</div>
          <div class="lesson-instrument">${l.instrument}</div>
          <div class="lesson-meta">${l.studio_name}${l.is_online ? ' · <span class="pill pill-online" style="font-size:0.65rem;">Online</span>' : ''}</div>
          <div style="margin-top:4px;">${attendancePill(attStatus)}</div>
          ${l.note_text ? `<div class="text-sm text-muted mt-1">📝 Note saved</div>` : ''}
          ${l.drive_link ? `<a href="${l.drive_link}" target="_blank" class="text-sm text-orange mt-1" style="display:inline-block;">📁 Drive link</a>` : ''}
        </div>
        <div class="lesson-actions">
          ${!isCancelled ? `
          <select class="att-select" id="att-${l.occurrence_id}" onchange="markAttendance('${l.occurrence_id}', this.value)">
            <option value="" ${!attStatus ? 'selected' : ''}>Mark attendance…</option>
            <option value="present"           ${attStatus==='present'           ? 'selected' : ''}>Present</option>
            <option value="absent_no_credit"  ${attStatus==='absent_no_credit'  ? 'selected' : ''}>Absent — No Credit</option>
            <option value="absent_notice"     ${attStatus==='absent_notice'     ? 'selected' : ''}>Absent — Notice Given</option>
            <option value="teacher_cancelled" ${attStatus==='teacher_cancelled' ? 'selected' : ''}>Teacher Cancelled</option>
          </select>
          <button class="btn btn-ghost btn-sm" onclick="openNoteModal('${l.occurrence_id}', '${l.student_name}', ${JSON.stringify(l.note_text ?? '').replace(/'/g,"&#39;")}, ${JSON.stringify(l.drive_link ?? '').replace(/'/g,"&#39;")})">
            ${l.note_text ? 'Edit Note' : '+ Add Note'}
          </button>` : '<span class="text-sm text-muted">Cancelled</span>'}
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  wrap.innerHTML = html || `<div class="card"><div class="empty-state">
    <div class="empty-state-icon">📅</div><h3>No lessons this week</h3>
  </div></div>`;
}

// ---- Mark attendance ----
async function markAttendance(occurrenceId, status) {
  if (!status) return;

  // Check if attendance record exists
  const { data: existing } = await db
    .from('attendance')
    .select('id')
    .eq('lesson_occurrence_id', occurrenceId)
    .single();

  let error;
  if (existing) {
    ({ error } = await db.from('attendance')
      .update({ status, marked_by: currentProfile.id, marked_at: new Date().toISOString() })
      .eq('id', existing.id));
  } else {
    ({ error } = await db.from('attendance')
      .insert({ lesson_occurrence_id: occurrenceId, status, marked_by: currentProfile.id, marked_at: new Date().toISOString() }));
  }

  if (error) {
    showToast('Could not save attendance. Please try again.', 'error');
  } else {
    showToast('Attendance saved.', 'success');
    // Update lesson occurrence status to completed if not cancelled
    await db.from('lesson_occurrences')
      .update({ status: status === 'teacher_cancelled' ? 'cancelled' : 'completed' })
      .eq('id', occurrenceId);
  }
}

// ---- Note modal ----
function openNoteModal(occurrenceId, studentName, noteText, driveLink) {
  activeOccurrenceId = occurrenceId;
  document.getElementById('noteModalTitle').textContent = `Lesson Note — ${studentName}`;
  document.getElementById('noteText').value  = noteText  ?? '';
  document.getElementById('driveLink').value = driveLink ?? '';
  document.getElementById('noteModal').classList.remove('hidden');
}

function closeNoteModal() {
  document.getElementById('noteModal').classList.add('hidden');
  activeOccurrenceId = null;
}

async function saveNote() {
  const noteText  = document.getElementById('noteText').value.trim();
  const driveLink = document.getElementById('driveLink').value.trim();

  if (!activeOccurrenceId) return;

  const { data: existing } = await db
    .from('lesson_notes')
    .select('id')
    .eq('lesson_occurrence_id', activeOccurrenceId)
    .single();

  let error;
  const payload = {
    lesson_occurrence_id: activeOccurrenceId,
    teacher_id:           teacherRecord.id,
    note_text:            noteText   || null,
    drive_link:           driveLink  || null,
    updated_at:           new Date().toISOString(),
  };

  if (existing) {
    ({ error } = await db.from('lesson_notes').update(payload).eq('id', existing.id));
  } else {
    ({ error } = await db.from('lesson_notes').insert(payload));
  }

  if (error) {
    showToast('Could not save note. Please try again.', 'error');
  } else {
    showToast('Note saved — student can now see it.', 'success');
    closeNoteModal();
    loadSchedule();
  }
}

document.getElementById('noteModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeNoteModal();
});

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
</script>
</body>
</html>
