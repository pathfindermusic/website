<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Change Password — Pathfinder Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
  <style>
    body {
      background: var(--charcoal);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .cp-wrap { width: 100%; max-width: 420px; }
    .cp-logo { text-align: center; margin-bottom: 2rem; }
    .cp-logo img { height: 38px; width: auto; }
    .cp-card { background: var(--white); border-radius: var(--r); box-shadow: 0 8px 40px rgba(0,0,0,0.3); overflow: hidden; }
    .cp-top { background: var(--orange); padding: 1.5rem; text-align: center; }
    .cp-top h1 { font-size: 1.15rem; font-weight: 700; color: var(--white); }
    .cp-top p { font-size: 0.82rem; color: rgba(255,255,255,0.82); margin-top: 0.25rem; }
    .cp-body { padding: 1.75rem; }
    .cp-banner {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: var(--r-sm);
      padding: 0.75rem 1rem;
      font-size: 0.82rem;
      color: #92400e;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      line-height: 1.55;
    }
    .cp-error {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      border-radius: var(--r-sm);
      padding: 0.7rem 0.9rem;
      font-size: 0.82rem;
      color: #dc2626;
      margin-bottom: 1rem;
      display: none;
    }
    .cp-success {
      background: #dcfce7;
      border: 1px solid #86efac;
      border-radius: var(--r-sm);
      padding: 0.7rem 0.9rem;
      font-size: 0.82rem;
      color: #16a34a;
      margin-bottom: 1rem;
      display: none;
    }
    .strength-bar-wrap {
      background: var(--light-grey);
      border-radius: 20px;
      height: 5px;
      margin-top: 0.4rem;
    }
    .strength-bar {
      height: 5px;
      border-radius: 20px;
      transition: width 0.2s, background 0.2s;
      width: 0%;
    }
    .strength-label {
      font-size: 0.72rem;
      margin-top: 0.25rem;
      color: var(--mid-grey);
    }
    .cp-footer {
      text-align: center;
      padding: 1rem 1.75rem 1.5rem;
      font-size: 0.78rem;
      color: var(--mid-grey);
      border-top: 1px solid var(--border);
    }
    .cp-footer a { color: var(--orange); text-decoration: none; }
  </style>
</head>
<body>
<div class="cp-wrap">
  <div class="cp-logo">
    <img src="../Logo_-_long.png" alt="Pathfinder Music Lessons">
  </div>
  <div class="cp-card">
    <div class="cp-top">
      <h1 id="cpTitle">Change Your Password</h1>
      <p id="cpSubtitle">Choose a new secure password for your account</p>
    </div>
    <div class="cp-body">
      <div class="cp-banner hidden" id="forcedBanner">
        ⚠️ You are logged in with a temporary password. Please set a new password before continuing.
      </div>
      <div class="cp-error" id="cpError"></div>
      <div class="cp-success" id="cpSuccess"></div>

      <div class="form-group">
        <label class="form-label">New Password *</label>
        <input class="form-input" type="password" id="newPassword"
          placeholder="At least 8 characters"
          oninput="checkStrength(this.value)">
        <div class="strength-bar-wrap">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password *</label>
        <input class="form-input" type="password" id="confirmPassword" placeholder="Repeat your new password">
      </div>

      <button class="btn btn-primary" id="cpBtn" onclick="changePassword()"
        style="width:100%;justify-content:center;margin-top:0.5rem;">
        Set New Password
      </button>
    </div>
    <div class="cp-footer" id="cpFooter">
      <a href="#" onclick="skipForNow()">Skip for now</a>
    </div>
  </div>
</div>

<div id="toastWrap" class="toast-wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
let currentProfile = null;
let isForced = false;

(async () => {
  const session = await getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  currentProfile = await getProfile();
  if (!currentProfile) { window.location.href = 'login.html'; return; }

  // Check if forced password change
  isForced = currentProfile.must_change_password === true;

  if (isForced) {
    document.getElementById('forcedBanner').classList.remove('hidden');
    document.getElementById('cpTitle').textContent     = 'Set Your Password';
    document.getElementById('cpSubtitle').textContent  = 'You must set a new password before continuing';
    document.getElementById('cpFooter').style.display  = 'none'; // hide skip link
  }
})();

function checkStrength(password) {
  const bar   = document.getElementById('strengthBar');
  const label = document.getElementById('strengthLabel');
  let strength = 0;
  if (password.length >= 8)                         strength++;
  if (/[A-Z]/.test(password))                       strength++;
  if (/[0-9]/.test(password))                       strength++;
  if (/[^A-Za-z0-9]/.test(password))                strength++;

  const levels = [
    { width: '0%',   color: 'var(--light-grey)', text: '' },
    { width: '25%',  color: '#dc2626',           text: 'Weak' },
    { width: '50%',  color: '#d97706',           text: 'Fair' },
    { width: '75%',  color: '#2563eb',           text: 'Good' },
    { width: '100%', color: '#16a34a',           text: 'Strong' },
  ];

  const level = password.length === 0 ? 0 : Math.min(strength, 4);
  bar.style.width      = levels[level].width;
  bar.style.background = levels[level].color;
  label.textContent    = levels[level].text;
  label.style.color    = levels[level].color;
}

async function changePassword() {
  const newPw  = document.getElementById('newPassword').value;
  const confPw = document.getElementById('confirmPassword').value;
  const errEl  = document.getElementById('cpError');
  const sucEl  = document.getElementById('cpSuccess');
  const btn    = document.getElementById('cpBtn');

  errEl.style.display = 'none';
  sucEl.style.display = 'none';

  if (!newPw || !confPw) {
    errEl.textContent = 'Please fill in both password fields.';
    errEl.style.display = 'block'; return;
  }
  if (newPw.length < 8) {
    errEl.textContent = 'Password must be at least 8 characters.';
    errEl.style.display = 'block'; return;
  }
  if (newPw !== confPw) {
    errEl.textContent = 'Passwords do not match.';
    errEl.style.display = 'block'; return;
  }

  btn.textContent = 'Saving…';
  btn.disabled    = true;

  // Update password via Supabase Auth
  const { error } = await db.auth.updateUser({ password: newPw });

  if (error) {
    errEl.textContent   = 'Could not update password: ' + error.message;
    errEl.style.display = 'block';
    btn.textContent = 'Set New Password';
    btn.disabled    = false;
    return;
  }

  // Clear the must_change_password flag
  await db.from('profiles')
    .update({ must_change_password: false })
    .eq('id', currentProfile.id);

  sucEl.textContent   = 'Password updated successfully!';
  sucEl.style.display = 'block';
  btn.textContent = 'Set New Password';
  btn.disabled    = false;

  // Redirect to dashboard after short delay
  setTimeout(() => {
    redirectByRole(currentProfile.role);
  }, 1500);
}

function skipForNow() {
  if (isForced) return; // can't skip if forced
  redirectByRole(currentProfile.role);
}

function redirectByRole(role) {
  const map = {
    superuser: 'dashboard-admin.html',
    admin:     'dashboard-admin.html',
    teacher:   'dashboard-teacher.html',
    student:   'dashboard-student.html',
  };
  window.location.href = map[role] ?? 'login.html';
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') changePassword();
});
</script>
</body>
</html>
