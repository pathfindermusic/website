<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Studios — Pathfinder Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
  <style>
    .studios-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 1.25rem; }
    .studio-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; transition: transform 0.15s, box-shadow 0.15s; }
    .studio-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-h); }
    .studio-card-top { background: var(--charcoal); padding: 1.25rem 1.5rem; border-bottom: 3px solid var(--orange); display: flex; align-items: center; justify-content: space-between; }
    .studio-name { font-size: 1.15rem; font-weight: 800; color: var(--white); }
    .studio-body { padding: 1.25rem 1.5rem; }
    .studio-detail { display: flex; align-items: flex-start; gap: 0.6rem; margin-bottom: 0.75rem; font-size: 0.875rem; color: var(--dark-grey); }
    .studio-detail a { color: var(--orange); text-decoration: none; }
    .studio-detail a:hover { text-decoration: underline; }
    .studio-footer { padding: 0.85rem 1.5rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; justify-content: flex-end; }
    @media(max-width:700px){ .studios-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="portal-shell">
  <nav class="topnav">
    <a href="#" class="topnav-logo"><img src="../Logo_-_long.png" alt="Pathfinder Music Lessons"></a>
    <div class="topnav-right">
      <button class="btn btn-ghost btn-sm" id="menuToggle" style="display:none;" onclick="toggleSidebar()">☰</button>
      <div class="topnav-user">
        <div class="topnav-avatar" id="navAvatar">–</div>
        <div>
          <div style="font-size:0.82rem;font-weight:500;color:var(--white);" id="navName">Loading…</div>
          <span class="topnav-role-badge" id="navRole">–</span>
        </div>
      </div>
      <a href="change-password.html" class="btn-logout" style="text-decoration:none;">🔑 Password</a>
      <button class="btn-logout" onclick="signOut()">Sign out</button>
    </div>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">Main</div>
    <a class="nav-item" href="dashboard-admin.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Schedule
    </a>
    <a class="nav-item" href="students.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Students
    </a>
    <a class="nav-item" href="teachers.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
      Teachers
    </a>
    <a class="nav-item" href="lessons.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Lessons
    </a>
    <div class="sidebar-section">Reports</div>
    <a class="nav-item" href="attendance-report.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Attendance
    </a>
    <div class="sidebar-section">Super User</div>
    <a class="nav-item active" href="studios.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Studios
    </a>
    <a class="nav-item" href="admins.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Admins
    </a>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-title">Studios</div>
        <div class="page-sub" id="studioCount">Loading…</div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openStudioModal()">+ Add Studio</button>
    </div>

    <div class="studios-grid" id="studiosGrid">
      <div style="grid-column:1/-1;"><div class="loading"><div class="spinner"></div> Loading studios…</div></div>
    </div>
  </main>
</div>

<!-- ADD/EDIT STUDIO MODAL -->
<div class="modal-overlay hidden" id="studioModal">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <span class="modal-title" id="studioModalTitle">Add Studio</span>
      <button class="modal-close" onclick="closeStudioModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editStudioId">
      <div class="form-group">
        <label class="form-label">Studio Name *</label>
        <input class="form-input" type="text" id="sName" placeholder="e.g. Box Hill">
      </div>
      <div class="form-group">
        <label class="form-label">Address</label>
        <input class="form-input" type="text" id="sAddress" placeholder="e.g. 123 Main Street, Box Hill VIC 3128">
      </div>
      <div class="form-group">
        <label class="form-label">Studio Email (Gmail)</label>
        <input class="form-input" type="email" id="sEmail" placeholder="e.g. boxhill@pathfindermusiclessons.com.au">
        <div class="form-hint">Used to send notifications to students of this studio.</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeStudioModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveStudio()">Save Studio</button>
    </div>
  </div>
</div>

<div id="toastWrap" class="toast-wrap"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
let allStudios = [];
let currentProfile = null;

(async () => {
  currentProfile = await requireAuth(['superuser']);
  if (!currentProfile) return;
  renderTopNavUser(currentProfile);
  if (window.innerWidth < 900) document.getElementById('menuToggle').style.display = '';
  await loadStudios();
})();

async function loadStudios() {
  const { data, error } = await db.from('studios').select('*').order('name');
  if (error) { showToast('Error loading studios: ' + error.message, 'error'); return; }
  allStudios = data ?? [];
  document.getElementById('studioCount').textContent =
    `${allStudios.filter(s => s.status === 'active').length} active · ${allStudios.length} total`;
  renderStudios();
}

function renderStudios() {
  const grid = document.getElementById('studiosGrid');
  if (!allStudios.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;"><div class="empty-state">
      <div class="empty-state-icon">🏫</div>
      <h3>No studios yet</h3>
      <p>Kilsyth and Ringwood should already be here — check your schema seed data.</p>
    </div></div>`;
    return;
  }

  grid.innerHTML = allStudios.map((s, idx) => `
    <div class="studio-card">
      <div class="studio-card-top">
        <div class="studio-name">${s.name}</div>
        <span class="pill pill-${s.status === 'active' ? 'active' : 'inactive'}">${s.status === 'active' ? 'Active' : 'Inactive'}</span>
      </div>
      <div class="studio-body">
        ${s.address ? `<div class="studio-detail">📍 <span>${s.address}</span></div>` : ''}
        ${s.email    ? `<div class="studio-detail">✉️ <a href="mailto:${s.email}">${s.email}</a></div>` : ''}
        ${!s.address && !s.email ? `<div class="text-sm text-muted">No details added yet.</div>` : ''}
      </div>
      <div class="studio-footer">
        <button class="btn btn-ghost btn-sm" onclick="openStudioModal(${idx})">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="toggleStudioStatus('${s.id}','${s.status}')">
          ${s.status === 'active' ? 'Deactivate' : 'Activate'}
        </button>
      </div>
    </div>`).join('');
}

function openStudioModal(idx = null) {
  if (idx !== null) {
    const s = allStudios[idx];
    document.getElementById('studioModalTitle').textContent = 'Edit Studio';
    document.getElementById('editStudioId').value = s.id;
    document.getElementById('sName').value         = s.name    ?? '';
    document.getElementById('sAddress').value      = s.address ?? '';
    document.getElementById('sEmail').value        = s.email   ?? '';
  } else {
    document.getElementById('studioModalTitle').textContent = 'Add Studio';
    document.getElementById('editStudioId').value = '';
    ['sName','sAddress','sEmail'].forEach(id => document.getElementById(id).value = '');
  }
  document.getElementById('studioModal').classList.remove('hidden');
}

function closeStudioModal() { document.getElementById('studioModal').classList.add('hidden'); }

async function saveStudio() {
  const name    = document.getElementById('sName').value.trim();
  const address = document.getElementById('sAddress').value.trim();
  const email   = document.getElementById('sEmail').value.trim();
  const editId  = document.getElementById('editStudioId').value;

  if (!name) { showToast('Please enter a studio name.', 'error'); return; }

  const payload = { name, address: address || null, email: email || null };

  if (editId) {
    const { error } = await db.from('studios').update(payload).eq('id', editId);
    if (error) { showToast('Error updating studio: ' + error.message, 'error'); return; }
    showToast('Studio updated.', 'success');
  } else {
    const { error } = await db.from('studios').insert({ ...payload, status: 'active' });
    if (error) { showToast('Error adding studio: ' + error.message, 'error'); return; }
    showToast('Studio added.', 'success');
  }

  closeStudioModal();
  await loadStudios();
}

async function toggleStudioStatus(id, current) {
  const newStatus = current === 'active' ? 'inactive' : 'active';
  const { error } = await db.from('studios').update({ status: newStatus }).eq('id', id);
  if (error) { showToast('Error updating studio.', 'error'); return; }
  showToast(`Studio ${newStatus === 'active' ? 'activated' : 'deactivated'}.`, 'success');
  await loadStudios();
}

document.getElementById('studioModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeStudioModal(); });
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
</script>
</body>
</html>
